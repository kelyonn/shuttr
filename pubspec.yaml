name: shuttr
description: "The digicam you never had, in your pocket."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  camera: ^0.12.1
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  gal: ^2.3.3
  go_router: ^18.0.1
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.3
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  purchases_flutter: ^10.13.2
  screen_brightness: ^2.1.11
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  image: ^4.10.1
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true

  shaders:
    - shaders/look.frag
    - shaders/preview.frag

  assets:
    - assets/luts/
    - assets/textures/
    - assets/frames/

  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
  # DSEG7 date-stamp font is added in S8 once assets/fonts/DSEG7Classic-Regular.ttf
  # exists (see docs/BUILD_PLAN.md). Declaring it before the file exists breaks the build.

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
